[project]
name = "diffusion-reward"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "cython<3",
  "dm-env>=1.6",
  "einops>=0.8.1",
  "gym",
  "hydra-core==1.1.0",
  "hydra-submitit-launcher==1.1.5",
  "imageio==2.9.0",
  "imageio-ffmpeg==0.4.4",
  "ipdb==0.13.9",
  "matplotlib==3.4.2",
  "metaworld",
  "mj-envs",
  "mjrl",
  "mujoco-py>=2.1,<2.2",
  "opencv-python==4.5.3.56",
  "pandas==1.3.0",
  "sklearn==0.0",
  "tb-nightly>=2.14.0a20230808",
  "termcolor==1.1.0",
  "torch==1.12.1+cu116",
  "torchvision==0.13.1+cu116",
  "wandb==0.15.4",
  "yapf==0.31.0",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
gym = { git = "https://github.com/jerrykal/gym.git", rev = "v0.21.0-custom.1" }
metaworld = { git = "https://github.com/Farama-Foundation/Metaworld.git", rev = "c822f28f582ba1ad49eb5dcf61016566f28003ba" }
mj-envs = { workspace = true, editable = true }
mjrl = { workspace = true, editable = true }

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu116"

[tool.uv.workspace]
members = ["env_dependencies/mj_envs", "env_dependencies/mjrl"]

[tool.uv]
environments = [
  "python_version == '3.8' and sys_platform == 'linux' and platform_machine == 'x86_64'",
]
required-environments = [
  "python_version == '3.8' and sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.build-backend]
module-root = ""
